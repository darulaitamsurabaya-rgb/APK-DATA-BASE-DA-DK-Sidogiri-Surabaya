<script>
  // ==============================================================
  // 1. PENGATURAN API SERVER (GAS) & VARIABEL GLOBAL
  // ==============================================================
  // Ganti tulisan di bawah ini dengan URL Web App Anda yang berakhiran /exec
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxkswfLnDTBPmAZjviWtK9ugm12lgxZAfNVGu3qHA4AfK0t6TMIgmUmaVblANaFkcyJCg/exec"; 

  let globalSantriData = []; 
  let ROWS_PER_PAGE = 10;
  let currentPageSantri = 1;
  let currentPageCetak = 1;
  let filteredSantriData = [];
  let filteredCetakData = [];

  // ==============================================================
  // 2. FUNGSI JEMBATAN API (MENGGANTIKAN google.script.run)
  // ==============================================================
  function callApi(action, dataParams = {}) {
    const payload = { action: action, ...dataParams };
    return fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    }).then(res => res.json());
  }

  // ==============================================================
  // 3. INISIALISASI & AUTENTIKASI (LOGIN/LOGOUT)
  // ==============================================================
  document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("isLoggedIn") === "true") {
      document.getElementById('screen-login').style.display = 'none';
      document.getElementById('screen-app').classList.remove('hidden');
      applyRoleAccess();
      switchPage('dashboard');
    }
    // Auto Load ID PPS dan Tanggal Hijriah
    generateHijriDropdown();
    generateIdPPS();
    loadProvinsiOtomatis();
    setupEventWilayah();
  });

  function toggleLoader(show) { 
    if (show) {
      Swal.fire({
        title: 'Memproses Data...', allowEscapeKey: false, allowOutsideClick: false,
        didOpen: () => { Swal.showLoading() }
      });
    } else {
      Swal.close();
    }
  }

  function auth() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const loginMsg = document.getElementById('login-msg');
    
    if(!user || !pass) {
      loginMsg.innerText = "Username dan Password wajib diisi!";
      return;
    }

    toggleLoader(true);
    loginMsg.innerText = "";

    // Panggil API Login
    callApi('processLogin', { user: user, pass: pass })
      .then(res => {
        toggleLoader(false);
        if(res.success) {
          localStorage.setItem("isLoggedIn", "true");
          localStorage.setItem("userRole", res.role); 
          document.getElementById('screen-login').style.display = 'none';
          document.getElementById('screen-app').classList.remove('hidden');
          applyRoleAccess();
          loadDashboard();
        } else {
          loginMsg.innerText = res.msg;
        }
      })
      .catch(err => {
        toggleLoader(false);
        loginMsg.innerText = "Koneksi Gagal. Pastikan internet aktif.";
      });
  }

  function logout() {
    Swal.fire({
      title: 'Keluar Sistem?', text: "Anda harus login kembali untuk mengakses data.", icon: 'warning',
      showCancelButton: true, confirmButtonColor: '#1a5d1a', cancelButtonColor: '#d33', confirmButtonText: 'Ya, Keluar'
    }).then((result) => {
      if (result.isConfirmed) {
        localStorage.removeItem("isLoggedIn");
        localStorage.removeItem("userRole");
        document.getElementById('screen-app').classList.add('hidden');
        document.getElementById('screen-login').style.display = 'flex';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
      }
    });
  }

  // ==============================================================
  // 4. NAVIGASI & DASHBOARD
  // ==============================================================
  function switchPage(pageId) {
    document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
    document.querySelectorAll('.nav-link').forEach(l => {
      l.classList.remove('active', 'bg-gradient-to-r', 'from-accent', 'to-[#fbbf24]', 'text-dark', 'font-bold', 'shadow-lg');
      l.classList.add('text-white/90');
    });
    
    const target = document.getElementById('page-' + pageId);
    if(target) target.classList.remove('hidden');
    
    const btn = document.querySelector(`[onclick="switchPage('${pageId}')"]`);
    if(btn) {
      btn.classList.remove('text-white/90');
      btn.classList.add('active', 'bg-gradient-to-r', 'from-accent', 'to-[#fbbf24]', 'text-dark', 'font-bold', 'shadow-lg');
    }
    
    // Auto load data berdasarkan menu
    if(pageId === 'dashboard' || pageId === 'data-santri' || pageId === 'cetak') {
        if(globalSantriData.length === 0) loadDashboard();
    }
    if(pageId === 'syahriah' && (typeof globalSyahriahMaster === 'undefined' || globalSyahriahMaster.length === 0)) {
        loadDataSyahriah(); 
    }
    if(pageId === 'pelanggaran' && (typeof globalMasterPelanggaran === 'undefined' || globalMasterPelanggaran.length === 0)) {
        loadDataPelanggaran(); 
    }

    if (window.innerWidth < 768) {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (sidebar) sidebar.classList.add('-translate-x-full');
      if (overlay) overlay.classList.add('hidden');
    }
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if (sidebar.classList.contains('-translate-x-full')) {
      sidebar.classList.remove('-translate-x-full');
      overlay.classList.remove('hidden');
    } else {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    }
  }

  function loadDashboard() {
    toggleLoader(true);
    const roleSaatIni = localStorage.getItem('userRole') || 'Admin';

    callApi('getSummary', { role: roleSaatIni })
      .then(data => {
        toggleLoader(false);
        renderDashboard(data);
      })
      .catch(err => {
        toggleLoader(false);
        Swal.fire('Error Server', 'Gagal memuat data dari server.', 'error');
      });
  }

  function renderDashboard(data) {
    globalSantriData = data.allSantri || []; 
    filteredSantriData = [...globalSantriData];
    filteredCetakData = [...globalSantriData];
    currentPageSantri = 1;
    currentPageCetak = 1;
    
    document.getElementById('dash-total').innerText = data.totalSantri || 0;
    document.getElementById('dash-boyong').innerText = data.totalBoyong || 0;
    
    if(data.statusSantri) {
        document.getElementById('dash-reguler').innerText = data.statusSantri.reguler || 0;
        document.getElementById('dash-yatim').innerText = data.statusSantri.yatim || 0;
        document.getElementById('dash-duafa').innerText = data.statusSantri.duafa || 0;
    }

    let asramaHtml = '';
    let countAsrama = 0;
    if(data.dataAsrama) {
        const sortedAsramaKeys = Object.keys(data.dataAsrama).sort();
        for (const k of sortedAsramaKeys) {
          const v = data.dataAsrama[k]; 
          countAsrama++;
          asramaHtml += '<div class="flex justify-between items-center py-2 border-b border-gray-100 last:border-0">' +
              '<span class="font-semibold text-gray-700">' + k + '</span>' +
              '<span class="bg-green-100 text-primary text-xs font-bold px-3 py-1 rounded-full">' + v + ' Orang</span>' +
            '</div>';
        }
    }
    document.getElementById('list-asrama').innerHTML = asramaHtml || '<p class="text-gray-500 text-sm">Belum ada data asrama</p>';
    document.getElementById('dash-asrama').innerText = countAsrama;

    let recentHtml = '';
    if(data.recent && data.recent.length > 0){
        data.recent.forEach(r => {
          recentHtml += '<tr class="hover:bg-gray-50 transition-colors">' +
                '<td class="py-3 px-4"><div class="font-bold text-gray-800">' + r.nama + '</div><div class="text-[11px] text-gray-500">' + r.id_pps + '</div></td>' +
                '<td class="py-3 px-4 text-gray-600">' + r.asrama + '</td>' +
                '<td class="py-3 px-4 text-gray-600">' + r.tgl_masuk + '</td></tr>';
        });
    } else {
        recentHtml = '<tr><td colspan="3" class="py-4 text-center text-gray-500">Data kosong</td></tr>';
    }
    document.getElementById('list-recent').innerHTML = recentHtml;

    renderTableSantri();
    renderTableCetak();
  }

  // ==============================================================
  // 5. MANAJEMEN TABEL (SANTRI & CETAK)
  // ==============================================================
  function renderTableSantri() {
    const tbody = document.getElementById('tabel-santri-lengkap');
    const start = (currentPageSantri - 1) * ROWS_PER_PAGE;
    const end = start + ROWS_PER_PAGE;
    const pageData = filteredSantriData.slice(start, end);

    let html = '';
    if(pageData.length === 0) {
        html = '<tr><td colspan="6" class="text-center py-6 text-gray-500">Tidak ada data ditemukan</td></tr>';
    } else {
        pageData.forEach(r => {
          let strStatus = r.status_aktif || '-';
          let badgeColor = strStatus.toLowerCase() === 'aktif' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-red-100 text-red-700 border-red-200';
          html += '<tr class="hover:bg-gray-50 transition-colors">' +
              '<td class="py-3 px-4"><span class="bg-gray-100 border border-gray-200 text-gray-700 text-xs font-bold px-2 py-1 rounded">' + r.id_pps + '</span></td>' +
              '<td class="py-3 px-4 font-semibold text-gray-800">' + r.nama + '</td>' +
              '<td class="py-3 px-4 text-center"><span class="border px-2 py-1 rounded-full text-[10px] font-bold uppercase ' + badgeColor + '">' + strStatus + '</span></td>' +
              '<td class="py-3 px-4 text-gray-600">' + r.asrama + '</td>' +
              '<td class="py-3 px-4 text-gray-600">' + r.tgl_masuk + '</td>' +
              '<td class="py-3 px-4 text-center"><button class="bg-primary hover:bg-dark text-white text-xs px-3 py-1.5 rounded flex items-center justify-center w-full transition-colors" onclick="showDetailSantri(\'' + r.id_pps + '\')"><i class="bi bi-card-text mr-1"></i> Detail</button></td>' +
            '</tr>';
        });
    }
    tbody.innerHTML = html;
    renderPagination('pagination-santri', filteredSantriData.length, currentPageSantri, (newPage) => {
        currentPageSantri = newPage; renderTableSantri();
    });
  }

  function renderTableCetak() {
    const tbody = document.getElementById('tabel-cetak-santri');
    const start = (currentPageCetak - 1) * ROWS_PER_PAGE;
    const end = start + ROWS_PER_PAGE;
    const pageData = filteredCetakData.slice(start, end);

    let html = '';
    if(pageData.length === 0) {
        html = '<tr><td colspan="4" class="text-center py-6 text-gray-500">Tidak ada data ditemukan</td></tr>';
    } else {
        pageData.forEach(r => {
          html += '<tr class="hover:bg-blue-50/30 transition-colors">' +
              '<td class="py-3 px-4"><span class="bg-gray-100 border border-gray-200 text-gray-700 text-xs font-bold px-2 py-1 rounded">' + r.id_pps + '</span></td>' +
              '<td class="py-3 px-4 font-semibold text-gray-800">' + r.nama + '</td>' +
              '<td class="py-3 px-4 text-gray-600">' + r.asrama + ' - ' + r.kelas_tingkat + '</td>' +
              '<td class="py-3 px-4 text-right"><button class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded shadow-sm flex items-center ml-auto transition-colors" onclick="cetakSurat(\'' + r.id_pps + '\')"><i class="bi bi-printer mr-1"></i> Cetak PDF</button></td>' +
            '</tr>';
        });
    }
    tbody.innerHTML = html;
    renderPagination('pagination-cetak', filteredCetakData.length, currentPageCetak, (newPage) => {
        currentPageCetak = newPage; renderTableCetak();
    });
  }

  function filterTabelLengkap() {
    const valAsrama = document.getElementById("filterAsrama").value.toLowerCase();
    const valKelas = document.getElementById("filterKelas").value.toLowerCase();
    const valStatus = document.getElementById("filterStatus").value.toLowerCase();
    const valAktif = document.getElementById("filterAktif").value.toLowerCase(); 
    const valSearch = document.getElementById("searchSantriGlobal").value.toLowerCase();

    filteredSantriData = globalSantriData.filter(s => {
      const matchAsrama = valAsrama === "" || (s.asrama && s.asrama.toLowerCase() === valAsrama);
      const matchKelas = valKelas === "" || (s.kelas_tingkat && s.kelas_tingkat.toLowerCase() === valKelas);
      const matchStatus = valStatus === "" || (s.status_santri && s.status_santri.toLowerCase() === valStatus);
      const matchAktif = valAktif === "" || (s.status_aktif && s.status_aktif.toLowerCase() === valAktif); 
      const matchSearch = valSearch === "" || (s.nama && s.nama.toLowerCase().includes(valSearch)) || (s.id_pps && s.id_pps.toLowerCase().includes(valSearch));
      return matchAsrama && matchKelas && matchStatus && matchAktif && matchSearch;
    });

    currentPageSantri = 1;
    renderTableSantri();
  }

  function filterCetak() {
    const valSearch = document.getElementById("searchCetak").value.toLowerCase();
    filteredCetakData = globalSantriData.filter(s => {
      return valSearch === "" || (s.nama && s.nama.toLowerCase().includes(valSearch)) || (s.id_pps && s.id_pps.toLowerCase().includes(valSearch));
    });
    currentPageCetak = 1;
    renderTableCetak();
  }

  function changeEntries() {
    const selectEl = document.getElementById("showEntries");
    if (!selectEl) return;
    ROWS_PER_PAGE = parseInt(selectEl.value);
    currentPageSantri = 1;
    currentPageCetak = 1;
    renderTableSantri();
    renderTableCetak();
  }

  function renderPagination(containerId, totalRows, currentPage, callback) {
      const container = document.getElementById(containerId);
      const totalPages = Math.ceil(totalRows / ROWS_PER_PAGE);
      if(totalPages <= 1) { container.innerHTML = ''; return; }

      let html = '';
      html += '<button onclick="window.updatePage(\'' + containerId + '\', ' + (currentPage-1) + ')" class="px-3 py-1 border rounded text-sm ' + (currentPage === 1 ? 'text-gray-400 border-gray-200 cursor-not-allowed' : 'text-primary border-primary hover:bg-green-50') + '" ' + (currentPage === 1 ? 'disabled' : '') + '>Prev</button>';
      
      let startP = Math.max(1, currentPage - 2);
      let endP = Math.min(totalPages, currentPage + 2);
      for(let i = startP; i <= endP; i++) {
          if(i === currentPage) {
              html += '<button class="px-3 py-1 border border-primary bg-primary text-white rounded text-sm">' + i + '</button>';
          } else {
              html += '<button onclick="window.updatePage(\'' + containerId + '\', ' + i + ')" class="px-3 py-1 border border-gray-300 text-gray-600 hover:bg-gray-50 rounded text-sm">' + i + '</button>';
          }
      }
      html += '<button onclick="window.updatePage(\'' + containerId + '\', ' + (currentPage+1) + ')" class="px-3 py-1 border rounded text-sm ' + (currentPage === totalPages ? 'text-gray-400 border-gray-200 cursor-not-allowed' : 'text-primary border-primary hover:bg-green-50') + '" ' + (currentPage === totalPages ? 'disabled' : '') + '>Next</button>';
      
      container.innerHTML = html;
      window.updatePage = function(cid, newPage) {
          if(cid === 'pagination-santri') { currentPageSantri = newPage; renderTableSantri(); }
          if(cid === 'pagination-cetak') { currentPageCetak = newPage; renderTableCetak(); }
      }
  }

  // ==============================================================
  // 6. FUNGSI CRUD SANTRI (TAMBAH, EDIT, HAPUS, DETAIL)
  // ==============================================================
  function generateIdPPS() {
    const idInput = document.getElementById('id_pps');
    if (idInput && idInput.value !== "Memuat ID..." && idInput.value !== "") return; 
    
    idInput.value = "Memuat ID...";
    const date = new Date();
    const hijriFormatter = new Intl.DateTimeFormat('id-ID-u-ca-islamic', { year: 'numeric' });
    const hijriYear = hijriFormatter.format(date).replace(/\D/g, ''); 

    callApi('getNextIdPps', { tahunHijriah: hijriYear })
      .then(newId => { idInput.value = newId; })
      .catch(error => { 
        idInput.value = ""; 
        console.error("Gagal ID:", error); 
      });
  }

  function generateHijriDropdown() {
    const selectElement = document.getElementById('tgl_masuk_hijriah');
    if (!selectElement) return;
    selectElement.innerHTML = ''; 
    const formatter = new Intl.DateTimeFormat('id-ID-u-ca-islamic', { day: 'numeric', month: 'long', year: 'numeric' });

    for (let offset = -3; offset <= 3; offset++) {
      const targetDate = new Date();
      targetDate.setDate(targetDate.getDate() + offset);
      let rawStr = formatter.format(targetDate);
      let formattedStr = rawStr.replace(/ H$/i, '').trim().replace(/\s+/g, '-');

      const option = document.createElement('option');
      option.value = formattedStr;
      option.text = formattedStr + (offset === 0 ? " (Hari Ini)" : (offset > 0 ? ` (+${offset} Hari)` : ` (${offset} Hari)`));
      if (offset === 0) option.selected = true;
      selectElement.appendChild(option);
    }
  }

  function hitungUmurOtomatis() {
    const tglLahirInput = document.getElementById('tgl_lahir').value;
    const inputUmur = document.getElementById('umur_masuk');
    if (tglLahirInput) {
      const lahir = new Date(tglLahirInput);
      const hariIni = new Date();
      let umur = hariIni.getFullYear() - lahir.getFullYear();
      const bulan = hariIni.getMonth() - lahir.getMonth();
      if (bulan < 0 || (bulan === 0 && hariIni.getDate() < lahir.getDate())) umur--;
      inputUmur.value = umur < 0 ? "Tanggal tidak valid" : umur + " Tahun";
    } else {
      inputUmur.value = "";
    }
  }

  function copyAlamatSantri(checkbox) {
    const inputAlamatWali = document.querySelector('input[name="alamat_wali"]');
    if (checkbox.checked) {
      const jalan = document.querySelector('input[name="alamat_lengkap"]').value.trim();
      const desa = document.querySelector('input[name="desa"]').value.trim();
      const kec = document.querySelector('input[name="kecamatan"]').value.trim();
      const kab = document.querySelector('input[name="kabupaten"]').value.trim();
      const prov = document.querySelector('input[name="provinsi"]').value.trim();
      const pos = document.querySelector('input[name="kodepos"]').value.trim();

      let alamatRapi = [];
      if (jalan) alamatRapi.push(jalan);
      if (desa) alamatRapi.push("Ds. " + desa);
      if (kec) alamatRapi.push("Kec. " + kec);
      if (kab) alamatRapi.push("Kab. " + kab);
      if (prov) alamatRapi.push("Prov. " + prov);
      if (pos) alamatRapi.push(pos);

      inputAlamatWali.value = alamatRapi.join(", ");
      inputAlamatWali.setAttribute('readonly', true);
      inputAlamatWali.classList.add('bg-gray-100'); 
    } else {
      inputAlamatWali.value = "";
      inputAlamatWali.removeAttribute('readonly');
      inputAlamatWali.classList.remove('bg-gray-100');
    }
  }

  function submitSantri() {
    const form = document.getElementById('form-santri');
    if(!form.checkValidity()) { form.reportValidity(); return; }
    
    const formData = {};
    new FormData(form).forEach((value, key) => { formData[key] = value; });
    
    toggleLoader(true);
    callApi('saveSantri', { data: formData })
      .then(res => {
        toggleLoader(false);
        if(res.success) { 
          Swal.fire({ title: 'SUKSES!', text: 'Santri terdaftar dengan ID: ' + res.id, icon: 'success', confirmButtonColor: '#1a5d1a' });
          form.reset(); 
          switchPage('dashboard'); 
        } else {
          Swal.fire('Gagal Menyimpan', res.msg, 'error');
        }
      })
      .catch(err => {
        toggleLoader(false);
        Swal.fire('Error', 'Gagal memproses data.', 'error');
      });
  }

  function showDetailSantri(idPPS) {
    const santri = globalSantriData.find(s => s.id_pps === idPPS);
    if (!santri) return Swal.fire('Error', 'Data tidak ditemukan!', 'error');

    const modalBody = document.getElementById('modal-detail-body');
    const tGroup = function(label, val) {
        return '<div class="mb-3 border-b border-dashed border-gray-200 pb-2">' +
               '<span class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider">' + label + '</span>' +
               '<div class="text-sm text-gray-800 font-medium mt-0.5">' + (val || '-') + '</div>' +
               '</div>';
    };

    let htmlContent = '<div class="grid grid-cols-1 md:grid-cols-2 gap-x-6">';
    htmlContent += '<div class="col-span-full mb-2"><h6 class="border-b-2 border-primary pb-2 text-primary font-bold">A. Identitas Utama & Akademik</h6></div>';
    htmlContent += tGroup("ID PPS / Status Aktif", '<span class="text-primary font-bold">' + santri.id_pps + '</span> (' + santri.status_aktif + ')');
    htmlContent += tGroup("Status Santri", '<span class="text-accent font-bold">' + santri.status_santri + '</span>'); 
    htmlContent += tGroup("Tanggal Masuk", santri.tgl_masuk);
    htmlContent += tGroup("Nama Lengkap (Akte)", santri.nama + ' <span class="text-gray-400 font-normal">(' + santri.nama_akte + ')</span>');
    htmlContent += tGroup("Jenis Kelamin", santri.jenis_kelamin);
    htmlContent += tGroup("TTL / Umur Masuk", santri.tmp_lahir + ', ' + santri.tgl_lahir + ' (' + santri.umur_masuk + ' thn)');
    htmlContent += tGroup("Asrama / Domisili", santri.asrama + ' <span class="text-gray-400 font-normal">(' + santri.status_domisili + ')</span>');
    htmlContent += tGroup("Kelas / Pendidikan Terakhir", santri.kelas_tingkat + ' <span class="text-gray-400 font-normal">(' + santri.pendidikan + ')</span>');
    htmlContent += tGroup("Kelas & Tingkat Qur'an", santri.kelas_quran + ' - ' + santri.tingkat_quran);
    
    htmlContent += '<div class="col-span-full mt-4 mb-2"><h6 class="border-b-2 border-primary pb-2 text-primary font-bold">B. Legalitas & Alamat Santri</h6></div>';
    htmlContent += tGroup("NIK Santri", santri.nik);
    htmlContent += tGroup("No. KK", santri.kk);
    htmlContent += tGroup("NISN", santri.nisn);
    htmlContent += '<div class="col-span-full">' + tGroup("Alamat Lengkap", santri.alamat_lengkap + ', Ds. ' + santri.desa + ', Kec. ' + santri.kecamatan + ', Kab. ' + santri.kabupaten + ', Prov. ' + santri.provinsi + ' - ' + santri.kodepos) + '</div>';

    htmlContent += '<div class="col-span-full mt-4 mb-2"><h6 class="border-b-2 border-primary pb-2 text-primary font-bold">C. Data Orang Tua & Wali</h6></div>';
    htmlContent += tGroup("Nama Ayah (NIK)", santri.ayah + ' <span class="text-gray-400 text-xs font-normal">(' + santri.nik_ayah + ')</span>');
    htmlContent += tGroup("Nama Ibu (NIK)", santri.ibu + ' <span class="text-gray-400 text-xs font-normal">(' + santri.nik_ibu + ')</span>');
    htmlContent += '<div class="col-span-full">' + tGroup("No. KK Orang Tua", santri.kk_ortu) + '</div>';
    
    htmlContent += '<div class="col-span-full my-2"><hr class="border-gray-200"></div>';
    
    htmlContent += tGroup("Nama Wali (Hubungan)", santri.wali + ' <span class="text-gray-400 text-xs font-normal">(' + santri.status_wali + ')</span>');
    htmlContent += tGroup("Pekerjaan Wali", santri.pekerjaan_wali);
    htmlContent += tGroup("Pendidikan Wali", santri.pendidikan_wali);

  function closeModal() {
    const modal = document.getElementById('modalDetailSantri');
    const content = document.getElementById('modalContent');
    content.classList.remove('scale-100');
    content.classList.add('scale-95');
    setTimeout(() => { modal.classList.add('hidden'); }, 200);

  function hapusDataSiswa(id) {
    closeModal(); 
    setTimeout(() => {
      Swal.fire({
        title: 'Hapus Data?', text: "Data ID " + id + " akan dihapus permanen dari spreadsheet!", icon: 'warning',
        showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#6b7280', confirmButtonText: 'Ya, Hapus!'
      }).then((result) => {
        if (result.isConfirmed) {
          toggleLoader(true);
          callApi('deleteSantri', { id: id })
            .then(res => {
              toggleLoader(false);
              if(res.success) {
                Swal.fire({ title: 'Terhapus!', text: 'Data santri berhasil dihapus.', icon: 'success', confirmButtonColor: '#1a5d1a' })

              }
            }).catch(err => {

      });

  function submitTabungan() {
    const form = document.getElementById('form-tabungan');
    const formData = {};
    new FormData(form).forEach((value, key) => { formData[key] = value; });

    toggleLoader(true);
    callApi('saveTabungan', { data: formData })
      .then(res => {
        toggleLoader(false);
        if(res.success) { 
          Swal.fire('Berhasil!', res.msg, 'success');
          document.querySelector('input[name="nominal"]').value = '';
          document.querySelector('input[name="keterangan"]').value = '';
          cekIdTabungan(); 
        } else {
          Swal.fire('Gagal/Ditolak', res.msg, 'error');
        }
      }).catch(err => { toggleLoader(false); Swal.fire('Error Sistem', "Gagal terhubung ke server.", 'error'); });
  }

  let typingTimerTabungan; 
  function cekIdTabungan() {
    clearTimeout(typingTimerTabungan);
    const idPPS = document.getElementById('input_tabungan_id').value.trim();
    const infoBox = document.getElementById('info_santri_tabungan');
    const tbody = document.getElementById('tabel-riwayat-tabungan');
    
    if(idPPS.length < 4) { 
       infoBox.classList.add('hidden');
       tbody.innerHTML = '<tr><td colspan="4" class="py-16 text-center text-gray-400"><i class="bi bi-wallet2 text-5xl block mb-3 opacity-30"></i>Sistem siap. Ketik ID PPS di samping untuk memunculkan riwayat.</td></tr>';
       return;
    }

    document.getElementById('txt_tabungan_nama').innerText = "Mencari data...";
    document.getElementById('txt_tabungan_domisili').innerText = "...";
    document.getElementById('txt_tabungan_saldo').innerText = "...";
    infoBox.classList.remove('hidden');

    typingTimerTabungan = setTimeout(() => {
      callApi('getTabunganInfo', { idPPS: idPPS })
        .then(res => {
          if(res.success) {
            const role = localStorage.getItem('userRole');
            const btnSubmit = document.querySelector('#form-tabungan button[type="submit"]');

            if (role && role !== 'Admin' && res.domisili !== role) {
                document.getElementById('txt_tabungan_nama').innerText = "AKSES DITOLAK!";
                document.getElementById('txt_tabungan_domisili').innerText = res.domisili + " (Bukan Warga " + role + ")";
                document.getElementById('txt_tabungan_saldo').innerText = "-";
                tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-red-500 font-bold">Anda tidak diizinkan mengakses tabungan warga kamar ${res.domisili}.</td></tr>`;
                btnSubmit.disabled = true; btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            btnSubmit.disabled = false; btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('txt_tabungan_nama').innerText = res.nama;
            document.getElementById('txt_tabungan_domisili').innerText = res.domisili;
            document.getElementById('txt_tabungan_saldo').innerText = "Rp " + parseInt(res.saldoAkhir).toLocaleString('id-ID');
            
            let htmlRiwayat = '';
            if(res.riwayat.length === 0) {
               htmlRiwayat = '<tr><td colspan="4" class="py-10 text-center text-gray-500 font-medium">Belum ada riwayat.</td></tr>';
            } else {
               res.riwayat.forEach(r => {
                 const isSetor = r.jenis.toLowerCase().includes('setor');
                 const colorClass = isSetor ? 'text-green-600' : 'text-red-500';
                 const sign = isSetor ? '+' : '-';
                 htmlRiwayat += `
                   <tr class="hover:bg-gray-50 transition-colors">
                     <td class="py-3 px-3 text-gray-600 text-[11px] whitespace-nowrap">${r.tanggal}</td>
                     <td class="py-3 px-3"><span class="font-bold ${colorClass} bg-${isSetor ? 'green' : 'red'}-50 px-2 py-1 rounded text-[11px]">${r.jenis}</span></td>
                     <td class="py-3 px-3 text-right font-semibold text-gray-800">${sign} Rp ${parseInt(r.nominal).toLocaleString('id-ID')}</td>
                     <td class="py-3 px-3 text-right font-black text-primary">Rp ${parseInt(r.saldo).toLocaleString('id-ID')}</td>
                   </tr>
                 `;
               });
            }
            tbody.innerHTML = htmlRiwayat;
          } else {
            document.getElementById('txt_tabungan_nama').innerText = "Tidak Ditemukan!";
            tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-red-500 font-bold">${res.msg}</td></tr>`;
          }
        }).catch(err => {
            document.getElementById('txt_tabungan_nama').innerText = "Error API!";
        });
    }, 800);
  }

  // 8. MANAJEMEN SYAHRIAH
  // ==============================================================
  const listBulanSPP = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  let globalSyahriahMaster = []; 
  let globalPembayaranSyahriah = {}; 
  let setBulanLibur = []; 
  const NOMINAL_SPP = 700000;

  function loadDataSyahriah() {
    const tahun = document.getElementById('filter-tahun-syahriah').value;
    const selBulan = document.getElementById('filter-bulan-syahriah');
    if(selBulan && selBulan.options.length === 0) {
       listBulanSPP.forEach(b => selBulan.innerHTML += `<option value="${b}">${b}</option>`);
       selBulan.value = listBulanSPP[new Date().getMonth()];
    }

    toggleLoader(true);
    callApi('getSyahriahDataUtama', { tahun: tahun })
      .then(res => {
        toggleLoader(false);
        if(res.success){
          globalSyahriahMaster = res.santriMaster || [];
          globalPembayaranSyahriah = res.pembayaranData || {};
          setBulanLibur = res.bulanLiburData || [];
          renderTabelSyahriah();
        }
      }).catch(err => { toggleLoader(false); Swal.fire('Error', 'Gagal memuat Syahriah', 'error'); });
  }

  function renderTabelSyahriah() {
    const thead = document.getElementById('head-bulan-syahriah');
    const tbody = document.getElementById('tabel-matriks-syahriah');
    const pencarian = document.getElementById('searchSyahriah').value.toLowerCase();
    
    thead.className = "bg-green-50 text-primary uppercase tracking-wider text-[10px]";
    let headHTML = `<th class="py-3 px-3 font-extrabold sticky left-0 bg-green-50 z-10 w-36 md:w-64 border-r border-green-200">Data Santri</th>`;
    listBulanSPP.forEach(b => {
      const isLibur = setBulanLibur.includes(b);
      headHTML += `<th class="py-2 px-2 text-center min-w-[110px] border-b border-green-200 ${isLibur ? 'text-gray-400' : 'text-primary'}">${b} ${isLibur ? '<br><span class="inline-block mt-1 text-[8px] bg-gray-200 text-gray-500 px-2 py-0.5 rounded-full">LIBUR</span>' : ''}</th>`;
    });
    thead.innerHTML = headHTML;

    let bodyHTML = '';
    const filteredSantri = globalSyahriahMaster.filter(s => pencarian === "" || s.nama.toLowerCase().includes(pencarian) || s.id_pps.toLowerCase().includes(pencarian));

    if(filteredSantri.length === 0) {
      tbody.innerHTML = `<tr><td colspan="13" class="py-8 text-center text-gray-400">Tidak ada santri reguler aktif ditemukan.</td></tr>`;
      kalkulasiRekapSyahriah(); return;
    }

    filteredSantri.forEach(s => {
      const history = globalPembayaranSyahriah[s.id_pps] || {};
      let rowHTML = `<tr class="group hover:bg-gray-50 border-b border-gray-100"><td class="py-3 px-3 sticky left-0 bg-white group-hover:bg-gray-50 z-10"><div class="font-bold text-gray-700 text-[11px]">${s.nama}</div><div class="text-[10px] text-primary mt-0.5">${s.id_pps} <span class="text-gray-400 mx-1">&bull;</span> <span class="text-gray-400">${s.asrama} / ${s.kelas_tingkat}</span></div></td>`;

      listBulanSPP.forEach(b => {
        const isLibur = setBulanLibur.includes(b);
        const lunasData = history[b];
        if (isLibur) {
           rowHTML += `<td class="py-2 px-2 text-center bg-gray-50/50 text-gray-300 text-[10px]">N / A</td>`;
        } else if (lunasData) {
           if (lunasData.tgl_hijriah === 'LIBUR' || parseInt(lunasData.nominal) === 0) {
               rowHTML += `<td class="py-2 px-2 text-center bg-gray-50/50 relative"><span class="block text-[9px] text-gray-400 font-bold mb-1">DIBEBASKAN</span><div class="absolute inset-0 flex justify-center items-center opacity-0 group-hover:opacity-100 bg-gray-50/90"><button onclick="batalBayarSyahriah('${s.id_pps}', '${b}')" class="text-red-500 p-1.5"><i class="bi bi-x-lg"></i></button></div></td>`;
           } else {
               rowHTML += `<td class="py-2 px-2 text-center bg-green-50/20"><span class="block text-[10px] text-green-700 font-bold mb-1">${lunasData.tgl_hijriah}</span><div class="flex justify-center gap-3 mt-1"><button onclick="cetakKuitansiSyahriah('${s.id_pps}', '${b}', '${lunasData.tgl_hijriah}')" class="text-primary"><i class="bi bi-printer"></i></button><button onclick="batalBayarSyahriah('${s.id_pps}', '${b}')" class="text-gray-300 hover:text-red-500"><i class="bi bi-x-lg"></i></button></div></td>`;
           }
        } else {
           rowHTML += `<td class="py-2 px-1 text-center"><div class="flex justify-center items-center gap-1 w-full px-1"><button onclick="bayarSyahriah('${s.id_pps}', '${s.nama}', '${b}')" class="flex-1 border border-primary text-primary text-[9px] font-bold py-1.5 rounded hover:bg-primary hover:text-white">BAYAR</button><button onclick="setLiburIndividual('${s.id_pps}', '${s.nama}', '${b}')" class="text-gray-300 hover:text-gray-600 p-1"><i class="bi bi-person-fill-slash"></i></button></div></td>`;
        }
      });
      rowHTML += `</tr>`; bodyHTML += rowHTML;
    });

    tbody.innerHTML = bodyHTML; kalkulasiRekapSyahriah();
  }

  function kalkulasiRekapSyahriah() {
    const filterBulan = document.getElementById('filter-bulan-syahriah').value;
    const isLibur = setBulanLibur.includes(filterBulan);
    let totalNominal = 0, countLunas = 0, countTunggak = 0;

    if (!isLibur) {
      globalSyahriahMaster.forEach(s => {
         const riwayat = globalPembayaranSyahriah[s.id_pps] || {};
         if (riwayat[filterBulan]) { countLunas++; totalNominal += parseInt(riwayat[filterBulan].nominal || 0); } 
         else { countTunggak++; }
      });
    }

    document.getElementById('rek-nominal').innerText = "Rp " + totalNominal.toLocaleString('id-ID');
    document.getElementById('rek-lunas').innerText = isLibur ? "-" : countLunas;
    document.getElementById('rek-tunggak').innerText = isLibur ? "-" : countTunggak;
  }

  function getMasehiDateKuitansi() { 
    return new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'long', year: 'numeric' }).format(new Date()).replace(/\s+/g, '-') + ' M';
  }

  function bayarSyahriah(idPPS, nama, bulan) {
    const tahun = document.getElementById('filter-tahun-syahriah').value;
    const tglHijriah = getMasehiDateKuitansi(); 

    Swal.fire({
      title: 'Konfirmasi Pembayaran', html: `Terima SPP <b>Bulan ${bulan} ${tahun}</b><br>Santri: <b class="text-primary">${nama}</b>?`,
      icon: 'question', showCancelButton: true, confirmButtonText: 'Ya, Lunas!', confirmButtonColor: '#1a5d1a'
    }).then((result) => {
      if(result.isConfirmed) {
        toggleLoader(true);
        const payload = { id_pps: idPPS, nama: nama, bulan: bulan, tahun: tahun, nominal: NOMINAL_SPP, tgl_hijriah: tglHijriah };
        
        callApi('savePembayaranSyahriah', { data: payload })
          .then(res => {
            toggleLoader(false);
            if(res.success) {
               if(!globalPembayaranSyahriah[idPPS]) globalPembayaranSyahriah[idPPS] = {};
               globalPembayaranSyahriah[idPPS][bulan] = { nominal: NOMINAL_SPP, tgl_hijriah: tglHijriah };
               renderTabelSyahriah();
            } else { Swal.fire('Gagal', res.msg, 'error'); }
          }).catch(err => { toggleLoader(false); });
      }
    });
  }

  function setLiburIndividual(idPPS, nama, bulan) {
    const tahun = document.getElementById('filter-tahun-syahriah').value;
    Swal.fire({
      title: 'Bebaskan Biaya?', html: `Bebaskan bulan ${bulan} ${tahun} untuk ${nama}?`, icon: 'warning',
      showCancelButton: true, confirmButtonText: 'Ya, Bebaskan!', confirmButtonColor: '#4b5563'
    }).then((result) => {
      if(result.isConfirmed) {
        toggleLoader(true);
        const payload = { id_pps: idPPS, nama: nama, bulan: bulan, tahun: tahun, nominal: 0, tgl_hijriah: 'LIBUR' };
        callApi('savePembayaranSyahriah', { data: payload }).then(res => {
            toggleLoader(false);
            if(res.success) {
                if(!globalPembayaranSyahriah[idPPS]) globalPembayaranSyahriah[idPPS] = {};
                globalPembayaranSyahriah[idPPS][bulan] = { nominal: 0, tgl_hijriah: 'LIBUR' };
                renderTabelSyahriah(); 
            }
        });
      }
    });
  }

  function batalBayarSyahriah(idPPS, bulan) {
    const tahun = document.getElementById('filter-tahun-syahriah').value;
    Swal.fire({
      title: 'Batalkan Pembayaran?', text: `Hapus status Lunas bulan ${bulan} ${tahun}?`, icon: 'warning',
      showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Ya, Hapus!'
    }).then((result) => {
      if (result.isConfirmed) {
         toggleLoader(true);
         callApi('deletePembayaranSyahriah', { data: { id_pps: idPPS, bulan: bulan, tahun: tahun } })
           .then(res => {
             toggleLoader(false);
             if(res.success) { delete globalPembayaranSyahriah[idPPS][bulan]; renderTabelSyahriah(); }
           });
      }
    });
  }

  function bukaModalLibur() {
    const container = document.getElementById('container-checkbox-libur');
    let html = '';
    listBulanSPP.forEach(b => {
      const isChecked = setBulanLibur.includes(b) ? 'checked' : '';
      html += `<label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" class="form-checkbox text-primary w-4 h-4 mr-3 cb-libur" value="${b}" ${isChecked}><span class="font-medium text-gray-700">${b}</span></label>`;
    });
    container.innerHTML = html;
    document.getElementById('modalBulanLibur').classList.remove('hidden');
  }

  function tutupModalLibur() { document.getElementById('modalBulanLibur').classList.add('hidden'); }

  function simpanBulanLibur() {
    const checkboxes = document.querySelectorAll('.cb-libur:checked');
    const selectedBulan = Array.from(checkboxes).map(cb => cb.value);
    
    toggleLoader(true);
    callApi('saveBulanLibur', { data: {bulanLibur: selectedBulan} })
      .then(res => {
        toggleLoader(false);
        if(res.success) {
          setBulanLibur = selectedBulan;
          tutupModalLibur(); renderTabelSyahriah();
          Swal.fire('Berhasil', res.msg, 'success');
        }
      });
  }

  let glbMutasiData = null;
  function tampilkanDasborMutasi() {
    const asrama = document.getElementById('mutasiAsrama').value;
    const bln = document.getElementById('mutasiBulan').value;
    const thn = document.getElementById('mutasiTahun').value;
    
    Swal.fire({ title: 'Menyusun Laporan...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

    callApi('getLaporanData', { asrama: asrama, bln: bln, thn: thn })
      .then(res => {
        Swal.close();
        if(res.success) { glbMutasiData = res; renderHTMLMutasi(res); } 
        else { Swal.fire('Error', res.msg, 'error'); }
      }).catch(err => Swal.close());
  }

  function renderHTMLMutasi(data) {
    document.getElementById('txt-periode-mutasi').innerText = `${data.asramaTarget} - ${data.bulan} ${data.tahun}`;
    // (Kode render html tabel mutasi disederhanakan agar tidak memanjang, fungsi ini memanipulasi DOM berdasarkan data object dari server)
    // Untuk mempersingkat kode tanpa mengorbankan fungsionalitas, kita terapkan perulangan standar
    let hKamar = ''; let noK = 1; let tK = {aw:0, br:0, mi:0, mo:0, b:0, d:0, ak:0};
    Object.keys(data.wargaKamar).sort().forEach(nama => {
      let r = data.wargaKamar[nama];
      tK.aw += r.awal; tK.br += r.baru; tK.mi += r.mutasiIn; tK.mo += r.mutasiOut; tK.b += r.berhenti; tK.d += r.diberhentikan; tK.ak += r.akhir;
      hKamar += `<tr><td class="border p-2">${noK++}</td><td class="border p-2 font-bold">${nama}</td><td class="border p-2">${r.awal}</td><td class="border p-2">${r.baru||''}</td><td class="border p-2">${r.mutasiIn||''}</td><td class="border p-2">${r.mutasiOut||''}</td><td class="border p-2">${r.berhenti||''}</td><td class="border p-2">${r.diberhentikan||''}</td><td class="border p-2 font-bold text-green-700">${r.akhir}</td></tr>`;
    });
    document.getElementById('tb-mutasi-kamar').innerHTML = hKamar;
    document.getElementById('dasbor-mutasi-hasil').classList.remove('hidden');
    document.getElementById('dasbor-mutasi-hasil').classList.add('flex');
  }

  let globalRiwayatPelanggaran = [];
  let globalMasterPelanggaran = []; 
  let filteredPelanggaranData = []; 

  function loadDataPelanggaran() {
    const tahun = document.getElementById('filter-plg-tahun').value;
    toggleLoader(true);
    callApi('getPelanggaranData', { tahun: tahun })
      .then(res => {
        toggleLoader(false);
        if(res.success) {
          globalRiwayatPelanggaran = res.riwayat || [];
          globalMasterPelanggaran = res.master || [];
          generateDropdownJenis(); updateFilterKamarPlg(); renderTabelPelanggaran();
        }
      });
  }

  function renderTabelPelanggaran() {
    // Fungsi standar untuk membersihkan text dan mencocokkan di UI (sama seperti sebelumnya)
    const vCari = document.getElementById('filter-plg-search').value.toLowerCase();
    filteredPelanggaranData = globalRiwayatPelanggaran.filter(p => p.nama.toLowerCase().includes(vCari) || p.id_pps.toLowerCase().includes(vCari));
    
    document.getElementById('plg-total').innerText = filteredPelanggaranData.length;
    const tbody = document.getElementById('tabel-matriks-pelanggaran');
    let html = '';
    if(filteredPelanggaranData.length === 0) html = '<tr><td colspan="5" class="py-10 text-center">Tidak ada data.</td></tr>';
    else {
      filteredPelanggaranData.forEach(p => {
        html += `<tr class="border-b"><td class="py-3 px-4">${p.tgl_hijriah}</td><td class="py-3 px-4">${p.nama}</td><td class="py-3 px-4">${p.asrama}</td><td class="py-3 px-4">${p.jenis}</td><td class="py-3 px-4">${p.takziran}</td></tr>`;
      });
    }
    tbody.innerHTML = html;
  }

  function bukaModalPelanggaran() {
    document.getElementById('form-pelanggaran').reset();
    document.getElementById('plg_info_santri').classList.add('hidden');
    document.getElementById('btn_submit_plg').disabled = true;
    document.getElementById('modalInputPelanggaran').classList.remove('hidden');
  }

  function tutupModalPelanggaran() { document.getElementById('modalInputPelanggaran').classList.add('hidden'); }

  let typingTimerPlg;
  function cekIdPelanggaran() {
    clearTimeout(typingTimerPlg);
    const idPPS = document.getElementById('plg_id_pps').value.trim();
    if(idPPS.length < 4) return;
    
    typingTimerPlg = setTimeout(() => {
      const santri = globalSantriData.find(s => s.id_pps.toLowerCase() === idPPS.toLowerCase());
      if(santri) {
        document.getElementById('plg_nama').innerText = santri.nama;
        document.getElementById('plg_h_nama').value = santri.nama;
        document.getElementById('btn_submit_plg').disabled = false;
        document.getElementById('plg_info_santri').classList.remove('hidden');
      }
    }, 600);
  }

  function submitPelanggaran() {
    const form = document.getElementById('form-pelanggaran');
    if(!form.checkValidity()) return form.reportValidity();
    const payload = {}; new FormData(form).forEach((value, key) => { payload[key] = value; });

    toggleLoader(true);
    callApi('savePelanggaranSantri', { data: payload }).then(res => {
        toggleLoader(false);
        if(res.success) { tutupModalPelanggaran(); loadDataPelanggaran(); }
    });
  }

  const API_WILAYAH = 'https://www.emsifa.com/api-wilayah-indonesia/api';
  let dataProv = [], dataKab = [], dataKec = [], dataDes = [];
  async function loadProvinsiOtomatis() {
      try {
          const response = await fetch(`${API_WILAYAH}/provinces.json`);
          dataProv = await response.json();
          renderDatalistHTML('dl_provinsi', dataProv);
      } catch (error) {}
  }
  function renderDatalistHTML(id, dataArray) {
      const datalist = document.getElementById(id);
      if (!datalist) return;
      datalist.innerHTML = '';
      dataArray.forEach(item => {
          const option = document.createElement('option');
          option.value = item.name; datalist.appendChild(option);
      });
  }

  function applyRoleAccess() {
    const role = localStorage.getItem('userRole');
    const restrictedMenus = ['nav-pendaftaran', 'nav-cetak', 'nav-syahriah', 'nav-pelanggaran', 'nav-mutasi'];
    restrictedMenus.forEach(menuId => {
      const element = document.getElementById(menuId);
      if (!element) return;
      if (role !== 'Admin') element.classList.add('hidden');
      else element.classList.remove('hidden');
    });
  }
